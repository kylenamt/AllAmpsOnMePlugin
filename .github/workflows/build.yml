name: Build & Release

# Runs on every push to main and every pull request (so broken builds are caught early),
# and additionally publishes a GitHub Release whenever you push a version tag like `v0.1.0`.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Needed so the release job can create/update releases.
permissions:
  contents: write

jobs:
  # Fast, JUCE-free check of the DSP core (bundle parse + FiLM fold + NAM
  # weight-order + render + morph + resampler). Fails quickly on DSP regressions.
  selftest:
    name: Engine self-test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y g++ cmake git libeigen3-dev
      - name: Run self-test
        run: ./tools/run_selftest.sh

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `label` names the download, so users can tell what a zip actually runs
        # on — the macOS build is Apple Silicon only (see CMAKE_OSX_ARCHITECTURES).
        include:
          - os: ubuntu-latest
            label: Linux
          # macos-14 is Apple Silicon and ships Xcode 15 (keeps -ld_classic working).
          - os: macos-14
            label: macOS-arm64
          - os: windows-latest
            label: Windows

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --target amp_morph_VST3 --config Release --parallel 4

      # The artefact folder layout differs by CMake generator (some nest outputs under a
      # Release/ subfolder), so collect the built bundles by name wherever they landed.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          find build/amp_morph_artefacts -name '*.vst3' \
            -prune -exec cp -R {} dist/ \;
          echo "Collected:" && ls -la dist
          test -n "$(ls -A dist)" || { echo "error: nothing packaged"; exit 1; }
          cd dist && zip -r "$GITHUB_WORKSPACE/AllAmpsOnMeMorph-${{ matrix.label }}.zip" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem build/amp_morph_artefacts -Recurse -Directory -Filter *.vst3 |
            ForEach-Object { Copy-Item $_.FullName dist -Recurse }
          Write-Host "Collected:"; Get-ChildItem dist
          if (-not (Get-ChildItem dist)) { throw "nothing packaged" }
          Compress-Archive -Path dist/* -DestinationPath AllAmpsOnMeMorph-${{ matrix.label }}.zip

      # Downloadable from the Actions run page on every build (kept ~90 days).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllAmpsOnMeMorph-${{ matrix.label }}
          path: AllAmpsOnMeMorph-*.zip

  # Publishing runs once, after every platform has built, rather than from inside
  # the matrix. Three concurrent action-gh-release calls race to write the same
  # release and can end up attaching nothing while still reporting success, which
  # is exactly how v0.1.0 shipped with no binaries.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's zip
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be attached
        run: find artifacts -type f -name '*.zip' -print

      - name: Attach zips to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          # Fail loudly rather than publishing an empty release.
          fail_on_unmatched_files: true
